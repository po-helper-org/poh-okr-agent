# Раздел «Управление целями»: доска OKR, планирование квартала и операционные задачи PO.
#
# Этот файл едет вместе с пакетом и применяется на любой машине, поэтому путей конкретного
# компьютера здесь нет. Обязательный workspaceRoot задаётся слоем профиля — точечной правкой
# конфигурации по идентификатору `okr-goals`:
#
#   - id: okr-goals
#     config:
#       workspaceRoot: '/путь/к/воркспейсу'
#
# Пока он не задан, плагин поднимется и сразу скажет, чего ему не хватает.
#
# Секретов здесь быть не должно: файл лежит в репозитории. Плагин ходит только в локальный
# `backlog` и наружу не обращается.
- insert:
    - id: okr-goals
      name: poh-okr-plugin
      config:
        backlogBin: backlog
        # Тип задач Backlog.md для ключевых результатов. Объектив — milestone, KR — задача
        # этого типа с привязкой к нему. Тип должен быть заведён в `backlog/config.yml`:
        #   backlog config set types "…,okr,potask"
        krTaskType: okr
        # Операционные задачи PO из панели работы: свой жизненный цикл, связь с KR —
        # зависимостью, а не родительством.
        poTaskType: potask
        # Документ Backlog.md с подписями столбцов доски. Подписи спринтов — свойство доски,
        # а не задачи, и держать их больше негде: своего хранилища у плагина нет.
        boardDocTitle: okr-board
        # Рабочее пространство по умолчанию для чатов по целям, относительно workspaceRoot.
        # Пустая строка — не привязывать, чат идёт в текущее пространство харнесса.
        sessionPath: ''
