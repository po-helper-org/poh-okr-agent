<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
/*__FONTS__*/

/* Direction. Product: one endless roadmap for the PO, tracks as rows, role lanes inside a track.
   Character: precise, calm, technical. Signature: the week ruler with holiday hatching.
   Graphite neutrals, roadmap navy as the single accent, status colors only on bars and dots, role colors only on lanes. */
:root {
  --bg: #fafafa; --surface: #ffffff; --raised: #f4f4f5;
  --ink: #171717; --ink-2: #525252; --muted: #737373;
  --line: rgba(23,23,23,.07); --line-strong: rgba(23,23,23,.16);
  --accent: #1e395f; --accent-ink: #ffffff; --accent-tint: #e8edf5;
  --holiday: rgba(23,23,23,.14);
  --s-done: #15803d; --s-work: #2563eb; --s-block: #dc2626; --s-open: #6b7280; --warn: #d97706;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141415; --surface: #19191b; --raised: #232325; --ink: #ededed; --ink-2: #a1a1a6; --muted: #85858b;
    --line: rgba(237,237,237,.07); --line-strong: rgba(237,237,237,.16);
    --accent: #264673; --accent-tint: #202b3b; --holiday: rgba(237,237,237,.14);
    --s-done: #1f7a43; --s-work: #3b6fd4; --s-block: #c53b3b; --s-open: #5b6574; --warn: #e0a030;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141415; --surface: #19191b; --raised: #232325; --ink: #ededed; --ink-2: #a1a1a6; --muted: #85858b;
  --line: rgba(237,237,237,.07); --line-strong: rgba(237,237,237,.16);
  --accent: #264673; --accent-tint: #202b3b; --holiday: rgba(237,237,237,.14);
  --s-done: #1f7a43; --s-work: #3b6fd4; --s-block: #c53b3b; --s-open: #5b6574; --warn: #e0a030;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 20px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.s-done { --c: var(--s-done); } .s-work { --c: var(--s-work); } .s-block { --c: var(--s-block); } .s-open { --c: var(--s-open); }

/* ---------- canvas ---------- */
#sc { position: absolute; inset: 0; overflow: auto; background: var(--surface); overscroll-behavior: contain; }
.in { position: relative; min-height: 100%; display: flex; flex-direction: column; }
.hd { position: sticky; top: 0; z-index: 6; display: flex; flex: none; height: 72px; }
.corner { position: sticky; left: 0; z-index: 7; flex: none; width: var(--lw); height: 72px; padding: 12px 16px; background: var(--surface);
  border-right: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); overflow: hidden; }
.ctitle { font-size: 16px; line-height: 24px; font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 0 12px; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 16px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.sq { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.ctop { display: flex; align-items: center; justify-content: space-between; height: 24px; }
.tog { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.tog button { height: 22px; padding: 0 10px; border: 0; background: transparent; font-size: 12px; cursor: pointer; }
.tog button:hover { background: var(--raised); }
.ctop .tog { margin-left: auto; } .ctop .tog + .tog { margin-left: 8px; }
.in.nodeps .dm, .in.nodeps svg.deps { display: none; }
.tog button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.back { display: inline-flex; align-items: center; gap: 4px; height: 24px; margin-left: -4px; padding: 0 8px 0 0; border-radius: 6px; color: var(--ink-2); font-size: 13px; text-decoration: none; }
.back:hover { color: var(--ink); background: var(--raised); }
.back svg { width: 16px; height: 16px; }
.cname { margin-top: 4px; font-size: 15px; line-height: 20px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.th { position: relative; flex: none; width: var(--tw); height: 72px; background: var(--accent); color: var(--accent-ink); border-bottom: 1px solid var(--line-strong); }
.hc { position: absolute; height: 24px; border-left: 1px solid rgba(255,255,255,.14); border-bottom: 1px solid rgba(255,255,255,.16); font-size: 12px; line-height: 23px; white-space: nowrap; }
.hc.q { top: 0; font-weight: 500; } .hc.m { top: 24px; }
.hc span { position: sticky; left: calc(var(--lw) + 8px); }
.hc.w { top: 48px; width: 28px; height: 24px; text-align: center; font: 400 10px/23px var(--mono); border-bottom: 0; overflow: hidden; }
.hc.w.now { background: var(--surface); color: var(--ink); font-weight: 500; }

.ov { position: absolute; z-index: 1; left: var(--lw); top: 72px; bottom: 0; width: var(--tw); pointer-events: none;
  background-image: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 28px); }
.ov .hol, .ov .tod, .ov .ql { position: absolute; top: 0; bottom: 0; }
.ov .hol { width: 28px; background: repeating-linear-gradient(135deg, var(--holiday) 0 2px, transparent 2px 6px); }
.ov .tod { width: 28px; background: var(--accent-tint); }
.ov .ql { width: 1px; background: var(--line-strong); }

.row { position: relative; display: flex; flex: none; border-bottom: 1px solid var(--line); }
.row.pad { flex: 1 1 auto; border-bottom: 0; min-height: 0; }
.lc { position: sticky; left: 0; z-index: 3; flex: none; width: var(--lw); background: var(--surface); border-right: 1px solid var(--line-strong); padding: 12px 16px; }
.tc { position: relative; flex: none; width: var(--tw); }

/* overview */
.row.go { height: 128px; cursor: pointer; }
.row.go:hover, .row.go:hover .lc { background: var(--raised); }
.row.go .lc { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.tn { font-size: 15px; line-height: 20px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tn i { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 8px; font-weight: 400; }
.tr { color: var(--muted); font-size: 12px; line-height: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ts { color: var(--ink-2); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; }
.lane { position: absolute; height: 8px; border-radius: 2px; background: var(--c); }
.lane.plan { opacity: .32; }

/* track page */
.row.res .lc { padding: 16px; }
.lab { color: var(--muted); font-size: 12px; line-height: 16px; margin-bottom: 4px; }
.restext { color: var(--ink-2); font-size: 13px; line-height: 20px; white-space: pre-line; }
.empty { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 16px; }
.row.rh { min-height: 48px; background: var(--surface); }
.rolebtn { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px; margin: -12px -16px; padding: 12px 16px 12px 8px; border: 0; background: transparent; text-align: left; cursor: pointer; }
.rolebtn:hover { background: var(--raised); }
.rolebtn.static { cursor: default; padding-left: 28px; } .rolebtn.static:hover { background: transparent; }
.chev { flex: none; width: 16px; height: 16px; color: var(--muted); }
.rn { font-weight: 500; }
.cnt { margin-left: auto; color: var(--muted); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rolebox { margin: -12px -16px; }
.plan { position: absolute; top: calc(50% - 6px); height: 12px; border-radius: 3px; background: var(--c); opacity: .3; }
.mini { position: absolute; height: 8px; border-radius: 2px; background: var(--c); }
.row.tk { min-height: 56px; cursor: pointer; }
.row.tk:hover, .row.tk:hover .lc { background: var(--raised); }
.row.tk.on, .row.tk.on .lc { background: var(--accent-tint); }
.row.tk .lc { padding: 8px 16px 8px 28px; }
.row.tk.l0 .lc { padding-left: 32px; } .row.tk.l0 .tt b { font-weight: 500; }
.row.tk.l1 .lc { padding-left: 36px; } .row.tk.l2 .lc { padding-left: 60px; }
.row.sh { min-height: 56px; background: var(--surface); }
.stbtn { display: flex; align-items: flex-start; gap: 8px; width: 100%; min-height: 56px; margin: -12px -16px; padding: 12px 16px 12px 8px; border: 0; background: transparent; text-align: left; cursor: pointer; }
.stbtn:hover { background: var(--raised); } .stbtn .chev { margin-top: 2px; }
.stx { min-width: 0; } .stx b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }
.stx span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; }
.roll { position: absolute; z-index: 2; top: calc(50% - 5px); height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 16%, transparent); }
.roll .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ink-2); }
.roll .pl { position: absolute; left: calc(100% + 8px); top: -3px; font: 400 11px/16px var(--mono); color: var(--ink-2); white-space: nowrap; }
.tt { display: flex; gap: 8px; font-size: 13px; line-height: 20px; }
.tt b { font-weight: 400; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--s-open)); flex: none; margin-top: 6px; }
.tm .sq { margin-right: 6px; }
.tm { margin: 2px 0 0 16px; color: var(--muted); font-size: 12px; line-height: 16px; font-variant-numeric: tabular-nums; }
.row.tk .tc { cursor: copy; }
.row.tk .tc.has { cursor: default; }
.bar { position: absolute; z-index: 2; top: calc(50% - 12px); height: 24px; border-radius: 6px; border: 1px solid var(--c); touch-action: none; cursor: grab;
  background: color-mix(in srgb, var(--c) 24%, var(--surface)); }
.bar:active { cursor: grabbing; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); border-radius: 5px; pointer-events: none; }
.bar .pl { position: absolute; left: calc(100% + 8px); top: 0; line-height: 22px; font: 400 11px/22px var(--mono); color: var(--ink-2); white-space: nowrap; pointer-events: none; }
.bar .h { position: absolute; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
.bar .h.l { left: -2px; } .bar .h.r { right: -2px; }
.bar.on { outline: 2px solid var(--ink); outline-offset: 1px; }
.gh { position: absolute; z-index: 2; top: calc(50% - 12px); height: 24px; width: 24px; margin-left: 2px; border: 1px dashed var(--muted); border-radius: 6px; display: none; pointer-events: none; }

/* floating controls */
.fab { position: fixed; z-index: 10; right: 16px; bottom: 16px; height: 32px; padding: 0 16px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 13px; cursor: pointer; }
.fab:hover { background: color-mix(in srgb, var(--accent) 88%, #fff); }
.fab:active, .btn:active, .seg button:active { transform: scale(.98); }
.toast { position: fixed; z-index: 30; left: 50%; bottom: 16px; max-width: calc(100vw - 32px); transform: translate(-50%, 8px); opacity: 0; pointer-events: none;
  padding: 8px 16px; border-radius: 8px; background: var(--ink); color: var(--surface); font-size: 13px; line-height: 20px; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* drawer */
.drawer { position: fixed; z-index: 20; top: 0; right: 0; bottom: 0; width: 340px; max-width: 100vw; display: flex; flex-direction: column; background: var(--surface);
  border-left: 1px solid var(--line-strong); transform: translateX(100%); visibility: hidden; }
.drawer.open { transform: none; visibility: visible; }
.dhead { display: flex; gap: 8px; align-items: flex-start; padding: 16px 16px 8px; flex: none; }
.dht { flex: 1; min-width: 0; }
.dtitle { font-size: 14px; line-height: 20px; font-weight: 500; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.dsub { margin-top: 2px; color: var(--muted); font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.x { flex: none; width: 28px; height: 28px; margin: -4px -4px 0 0; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }
.x:hover { background: var(--raised); color: var(--ink); } .x svg { width: 16px; height: 16px; }
.dbody { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 8px 16px 8px; }
.pane { display: none; } .pane.on { display: block; }
.plist { display: grid; border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; min-height: 36px; border-bottom: 1px solid var(--line); gap: 8px; }
.prow .pk { color: var(--muted); font-size: 13px; }
.psel, .pdate { width: 100%; height: 30px; padding: 0 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; }
.psel:hover, .pdate:hover, .psel:focus-visible, .pdate:focus-visible { border-color: var(--line-strong); background: var(--raised); outline: none; }
.pdate { font-variant-numeric: tabular-nums; } .pdate.bad { border-color: var(--s-block); }
.pdate::-webkit-calendar-picker-indicator { opacity: .6; cursor: pointer; }
.pclr { margin-top: 4px; padding: 4px 0; font-size: 12px; }
.list.work { margin-bottom: 8px; }
.sec { margin-top: 16px; } .sec:first-child { margin-top: 0; }
.lab { color: var(--muted); font-size: 12px; line-height: 16px; margin-bottom: 4px; }
.sec > .lab { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
.seg { display: grid; gap: 8px; }
.seg.c2 { grid-template-columns: 1fr 1fr; } .seg.c3 { grid-template-columns: repeat(3, 1fr); }
.seg button { display: flex; align-items: center; justify-content: center; gap: 8px; height: 32px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); font-size: 13px; cursor: pointer; white-space: nowrap; }
.seg.c3 button { height: 28px; font-size: 12px; }
.seg button:hover { background: var(--raised); }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg .dot, .seg .sq { margin: 0; }
.seg button[aria-pressed="true"] .sq { box-shadow: 0 0 0 1px rgba(255,255,255,.7); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fld { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; line-height: 16px; margin-top: 12px; }
.two .fld, .sec > .fld:first-child { margin-top: 0; }
.fld input, .fld textarea, .sel, .newin { width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); font: 13px var(--font); }
.fld input[type=date] { font-family: var(--mono); font-size: 12px; }
.fld textarea { height: 112px; padding: 8px; resize: vertical; line-height: 20px; }
.fld input.bad { border-color: var(--s-block); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
.btn { height: 28px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font-size: 12px; cursor: pointer; }
.btn:hover { background: var(--raised); }
.btn.danger { color: var(--s-block); } .btn.danger[data-armed="1"] { background: var(--s-block); border-color: var(--s-block); color: #fff; }
.btn.link { height: 16px; border-color: transparent; color: var(--muted); padding: 0; font-size: 12px; line-height: 16px; background: transparent; } .btn.link:hover { color: var(--ink); }
.big { font: 500 16px/16px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; height: 24px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.meta { margin-top: 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; color: var(--ink-2); font-size: 12px; line-height: 16px; }
.meta dt { color: var(--muted); } .meta dd { margin: 0; overflow-wrap: anywhere; }
.lnk { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 4px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; font-size: 13px; line-height: 20px; cursor: pointer; }
.lnk:hover { background: var(--raised); } .lnk .dot { margin: 0; }
.lnk b { font-weight: 400; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lnk i { font-style: normal; color: var(--muted); font-size: 12px; font-family: var(--mono); white-space: nowrap; }
.lnk.static { cursor: default; } .lnk.static:hover { background: transparent; }
.lnk .rm { flex: none; width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; }
.lnk .rm:hover { background: var(--surface); color: var(--ink); } .lnk .rm svg { width: 14px; height: 14px; }
.lnk .warn { color: var(--s-block); font-style: normal; font-family: var(--font); }
.list { margin: 0 -8px; } .none { color: var(--muted); font-size: 12px; line-height: 16px; padding: 0 0 0 0; }
.dnav { flex: none; display: flex; justify-content: center; gap: 4px; align-self: center; margin: 8px 0 16px; padding: 4px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); }
.dnav button { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.dnav button:hover { color: var(--ink); }
.dnav button svg { width: 20px; height: 20px; flex: none; }
.dnav button span { display: none; }
.dnav button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.dnav button[aria-pressed="true"] span { display: inline; }
@media (max-width: 700px) {
  .drawer { top: auto; left: 0; right: 0; width: 100%; max-height: 70vh; border-left: 0; border-top: 1px solid var(--line-strong); transform: translateY(100%); }
}

/* rows: nesting, add, collapse, dependencies */
.row.tk { --pl: 28px; } .row.l0 { --pl: 32px; } .row.l1 { --pl: 36px; } .row.l2 { --pl: 60px; } .row.l3 { --pl: 84px; }
.row.tk .lc { padding: 8px 40px 8px var(--pl); }
.row.l0 .tt b { font-weight: 500; }
.tg { position: absolute; left: calc(var(--pl) - 22px); top: 9px; width: 20px; height: 20px; padding: 2px; border: 0; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; }
.tg:hover { background: var(--surface); color: var(--ink); } .tg svg { width: 16px; height: 16px; display: block; }
.addb { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; padding: 5px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; opacity: 0; }
.addb svg { width: 18px; height: 18px; display: block; }
.row:hover .addb, .addb:focus-visible { opacity: 1; }
.addb:hover { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
@media (hover: none) { .addb { opacity: 1; } }
.row.sh .lc, .row.rh .lc { position: sticky; }
.stbtn { padding-right: 40px; }
.row.add .lc { padding: 8px 16px 8px var(--pl, 28px); background: var(--accent-tint); }
.row.add { --pl: 36px; } .row.add.l0 { --pl: 32px; } .row.add.l2 { --pl: 60px; } .row.add.l3 { --pl: 84px; } .row.add.r { --pl: 28px; }
.row.add .tc { background: var(--accent-tint); }
.addin { width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); font: 13px var(--font); }
.addh { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 16px; }
.tm .warn { color: var(--s-block); }
svg.deps { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; overflow: visible; }
.deps path { fill: none; stroke: var(--muted); stroke-width: 1.25; } .deps polygon { fill: var(--muted); }
.deps .bad { stroke: var(--s-block); } .deps polygon.bad { fill: var(--s-block); stroke: none; }
.fabs { position: fixed; z-index: 10; right: 16px; bottom: 16px; display: flex; gap: 8px; }
.fabs .fab { position: static; }
.fab.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); } .fab.ghost:hover { background: var(--raised); }
.fab[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .drawer { transition: transform 240ms var(--ease), visibility 240ms; }
  .toast { transition: opacity 200ms var(--ease), transform 200ms var(--ease); }
  .seg button, .btn, .fab, .dnav button, .lnk, .addb, .tg, .rolebtn, .row.go, .row.tk, .row .lc, .x, .back { transition: background-color 150ms var(--ease), border-color 150ms var(--ease), color 150ms var(--ease), transform 150ms var(--ease); }
}

/* milestones and blockers */
